[project]
name = "learnassist-ai"
version = "0.1.0"
description = "Ingestion pipeline, RAG orchestration and quiz generation for the AI-Powered Learning Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30",
    "pgvector>=0.4",
    "httpx>=0.28",
    "aioboto3>=15.5",
    # Document parsing (Phase 1-2)
    "pymupdf>=1.26",
    "python-pptx>=1.0",
    "python-docx>=1.2",
    "tiktoken>=0.12",
    "redis>=6.4",
    # Phase 3: speech-to-text. CPU int8 keeps an hour-long lecture tractable.
    "faster-whisper>=1.2",
    # Qwen3-ASR, used for every language it supports; Whisper keeps Khmer. torch is
    # not a declared dependency of qwen-asr. The Dockerfile installs the CPU build
    # first so pip does not pull the multi-gigabyte CUDA one.
    "qwen-asr>=0.0.6",
    "torch>=2.6",
    # Chat resources: voice-message uploads (FastAPI Form/File needs it), article
    # extraction for web links, and audio download for YouTube links. yt-dlp tracks
    # YouTube's frequent changes; if links start failing, upgrading it is the fix.
    "python-multipart>=0.0.20",
    "trafilatura>=2.0",
    "yt-dlp>=2025.9.26",
]

[project.optional-dependencies]
# Phase 4: OCR fallback for scanned PDFs / image-only slides. Kept optional
# because paddlepaddle is a large wheel that most ingests never need.
ocr = [
    "paddleocr>=3.2",
    "paddlepaddle>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: downloads model weights or runs inference; deselect with -m 'not slow'",
]
