# AI-Powered Learning Assistant — local development stack.
#
# NOTE: Ollama runs natively on the host so it can use the GPU. The live host
# endpoint is configured through environment variables and should point at the
# actual server running Ollama rather than a Docker-only alias.
# See README.md "Host prerequisites".

name: learnassist

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnassist}
      POSTGRES_USER: ${POSTGRES_USER:-learnassist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnassist}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once on first init, before Flyway ever connects.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnassist} -d ${POSTGRES_DB:-learnassist}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3000,http://127.0.0.1:3001,http://127.0.0.1:3000}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: ${RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS:-*}
    ports:
      - "${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Named volumes, not bind mounts: RustFS runs as uid 10001 and a Windows
      # bind mount cannot be chown'd to it.
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      # No -f: an unauthenticated request to the S3 root correctly returns 403,
      # and -f would treat that healthy response as a failure.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    # Answers and summaries are regenerable, so an eviction is a cache miss rather
    # than data loss; no persistence is configured deliberately.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  guard:
    # LLM Guard (prompt injection, toxicity) for chat questions and answers. Its own
    # service because it pins a transformers version Qwen3-ASR in `ai` cannot use.
    # Internal only: no published port.
    build:
      context: ./guard
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      GUARD_INJECTION_THRESHOLD: ${GUARD_INJECTION_THRESHOLD:-0.92}
      GUARD_TOXICITY_THRESHOLD: ${GUARD_TOXICITY_THRESHOLD:-0.8}
    volumes:
      # Classifier weights (~1 GB), kept across rebuilds.
      - guard-cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ai:
    build:
      context: ./ai
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-learnassist}:${POSTGRES_PASSWORD:-learnassist}@postgres:5432/${POSTGRES_DB:-learnassist}
      S3_ENDPOINT: ${RUSTFS_ENDPOINT:-http://rustfs:9000}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${RUSTFS_BUCKET:-lecture-uploads}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://172.168.5.2:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:32b-instruct}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Guardrails on every chat question and answer; empty disables them.
      GUARD_URL: ${GUARD_URL:-http://guard:8000}
      # Speech-to-text runs inside this container (unlike Ollama, which is external).
      # Qwen3-ASR for the languages it supports; Whisper for Khmer and detection.
      SPEECH_BACKEND: ${SPEECH_BACKEND:-qwen}
      QWEN_ASR_MODEL: ${QWEN_ASR_MODEL:-Qwen/Qwen3-ASR-0.6B}
      QWEN_ASR_DEVICE: ${QWEN_ASR_DEVICE:-cpu}
      QWEN_ASR_BATCH_SIZE: ${QWEN_ASR_BATCH_SIZE:-4}
      # int8 on CPU is what keeps an hour-long lecture tractable.
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
      # Khmer fine-tune, used for Khmer voice messages and Khmer recordings.
      WHISPER_MODEL_KM: ${WHISPER_MODEL_KM:-PhanithLIM/whisper-small-khmer-ct2}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+khm}
    ports:
      - "${AI_PORT:-8000}:8000"
    extra_hosts:
      # Keep the host mapping for environments that still need it, though the
      # Ollama endpoint should resolve via the actual node IP in production.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
      redis:
        condition: service_healthy
      guard:
        condition: service_started
    volumes:
      # Hot reload during development.
      - ./ai/app:/srv/app:ro
      # Cache for whisper / OCR model weights so they survive rebuilds.
      - model-cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Renders Slidev decks: `slidev build` (static site, served to students by the API)
  # and `slidev export` (PDF, headless Chromium). Internal only, like `ai`.
  slides:
    build:
      context: ./slides
    environment:
      S3_ENDPOINT: ${RUSTFS_ENDPOINT:-http://rustfs:9000}
      S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${RUSTFS_BUCKET:-lecture-uploads}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
    depends_on:
      rustfs:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3030/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-learnassist}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-learnassist}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-learnassist}
      APP_S3_ENDPOINT: ${RUSTFS_ENDPOINT:-http://rustfs:9000}
      APP_S3_PUBLIC_ENDPOINT: ${RUSTFS_PUBLIC_ENDPOINT:-http://localhost:9000}
      APP_S3_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      APP_S3_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      APP_S3_BUCKET: ${RUSTFS_BUCKET:-lecture-uploads}
      APP_AI_BASE_URL: ${AI_BASE_URL:-http://ai:8000}
      APP_AI_INTERNAL_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
      APP_SLIDES_BASE_URL: ${SLIDES_BASE_URL:-http://slides:3030}
      APP_JWT_SECRET: ${JWT_SECRET:-dev-only-secret-replace-with-openssl-rand-base64-48}
      APP_JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-1440}
      APP_CORS_ORIGIN: http://localhost:${WEB_PORT:-3001}
      SERVER_PORT: 8080
    ports:
      - "${API_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai:
        condition: service_started
      slides:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081}
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
  rustfs-data:
  rustfs-logs:
  model-cache:
  guard-cache:
